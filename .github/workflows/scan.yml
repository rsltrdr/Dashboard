name: Meme Coin Radar scan

on:
  schedule:
    # Hourly, at 20 past. GitHub queues scheduled runs under load, so the
    # actual time drifts a few minutes; that is normal and harmless here.
    - cron: "20 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit the results back to the repo

concurrency:
  group: radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # v5/v6 run on Node 24. The older v4/v5 pair still works but throws a
      # deprecation warning on every run, because they were built for Node 20,
      # which is end of life.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run scan
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python scan.py

      - name: Commit results
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          # state/perps.json MUST be committed: the distribution screen works by
          # comparing this run's open interest and volume against the previous
          # run's. Left unstaged, it is rebuilt and thrown away every time and
          # the screen can never find a signal.
          git add data/candidates.json state/holders.json state/perps.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
